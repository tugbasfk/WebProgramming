<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Number Guessing Game</h1>

        <p>Guess a number between 1 and 100!</p>
        <p>You have 10 attempts to guess correctly.</p>

        <h2>Enter Your Guess</h2>

        <div class="guess-section">

            <input type="number" id="guessInput" min="1" max="100" step="1" aria-label="Enter your guess">

            <button id="guessButton">Submit Guess</button>

        </div>

        <p id="message"></p>

        <h3>Attempts Remaining: <span id="attempts">10</span></h3>

        <progress id="progressBar" value="10" max="10" aria-label="Remaining attempts"></progress>

        <div class="history-section">

            <h3>Guess History</h3>

            <p id="guessHistory">No guesses yet.</p>

        </div>

        <h3>Game Score</h3>

        <div class="score-section">

            <div class="win-box">
                <p>Wins</p>
                <span id="wins">0</span>
            </div>

            <div class="loss-box">
                <p>Losses</p>
                <span id="losses">0</span>
            </div>

        </div>

        <button id="restartButton">Play Again</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
