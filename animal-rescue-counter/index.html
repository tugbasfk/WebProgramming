<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Rescue Counter</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Animal Rescue Counter</h1>

        <div class="animal-counters">

            <div class="animal-card">
                <h2>Cats</h2>
                <p id="catCount">0</p>
                <button id="catBtn">+ Add Cat</button>
            </div>

            <div class="animal-card">
                <h2>Dogs</h2>
                <p id="dogCount">0</p>
                <button id="dogBtn">+ Add Dog</button>
            </div>

            <div class="animal-card">
                <h2>Birds</h2>
                <p id="birdCount">0</p>
                <button id="birdBtn">+ Add Bird</button>
            </div>

            <div class="animal-card">
                <h2>Small Animals</h2>
                <p>Rabbits, Rats, Hamsters, Guinea Pigs</p>
                <p id="smallCount">0</p>
                <button id="smallBtn">+ Add Small Animal</button>
            </div>

            <div class="animal-card">
                <h2>Reptiles</h2>
                <p id="reptileCount">0</p>
                <button id="reptileBtn">+ Add Reptile</button>
            </div>

        </div>

        <div class="total-box">
            <h2>Total Animals</h2>
            <p id="totalCount">0</p>
        </div>

    </div>

</body>
</html>
