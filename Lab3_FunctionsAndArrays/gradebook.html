<head>
    <meta charset="UTF-8">
    <title>Student Gradebook</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Student Gradebook</h1>

    <h2>Add Student</h2>

    <form id="studentForm">
        <label for="studentName">Name:</label>
        <input type="text" id="studentName" required>

        <label for="studentScore">Score:</label>
        <input type="number" id="studentScore" min="0" max="100" required>

        <button type="submit">Add Student</button>
    </form>

    <h2>Grade Results</h2>

    <button onclick="sortByName()">Sort by Name</button>
    <button onclick="sortByScore()">Sort by Score</button>

    <div id="gradebook"></div>

    <script src="script.js"></script>

</body>
