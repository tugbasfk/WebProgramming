<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World Exercise</title>
</head>
<body>

    <h2>JavaScript Hello World Examples</h2>

    <!-- Target container for Version 3 -->
    <div id="output"></div>

    <script>
        // Version 1: Alert Dialog
        alert("Hello, World!");

        // Version 2: Console Log
        console.log("Hello, World!");

        // Version 3: DOM Target ID
        document.getElementById("output").textContent = "Hello, World! (Rendered inside div)";
    </script>

</body>
</html>
